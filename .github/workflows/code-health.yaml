name: 'Code Health'
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'cfn-resources/go.mod'
      - name: Setup and verify
        run: make tools verify
  mock-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'cfn-resources/go.mod'
      - name: Generate mocks
        run: |
          make tools generate-mocks
      - name: Check for uncommited files
        run: |
          FILES=$(git ls-files -o -m --directory --exclude-standard --no-empty-directory)
          LINES=$(echo "$FILES" | awk 'NF' | wc -l)

          if [ "$LINES" -ne 0 ]; then
            echo "Detected files that need to be committed:"
            echo "$FILES" | while IFS= read -r line; do echo "  $line"; done
            echo ""
            echo "Mock skeletons are not up-to-date, you may have forgotten to run mockery before committing your changes."
            exit 1
          fi
  github-linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'cfn-resources/go.mod'
      - name: actionlint
        run: |
          make tools
          actionlint -verbose -color
        shell: bash
      - name: Run ShellCheck
        uses: bewuethr/shellcheck-action@80bac2daa9fcf95d648200a793d00060857e6dc4
  check-copyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'cfn-resources/go.mod'
      - name: install tools
        run: make tools
      - name: check copyright
        run: ./.github/scripts/check-licenses.sh
        shell: bash
  dependency-review:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Setup cfn-lint'
        uses: scottbrenner/cfn-lint-action@8affffc34dddd6937bbc37f60901f71657e20fab
      - name: 'Run cfn-lint'
        run: |
          shopt -s globstar # enable globbing
          cfn-lint --version
      - run: cfn-lint ./cfn-resources/**/*.yml
      - run: cfn-lint ./cfn-resources/**/*.yaml
        if: always() # run even if previous step fails to lint all files
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: 'cfn-resources/go.mod'
      - name: run-unit-test
        run: make unit-test
